server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA lives under /ui/ — rewrite strips the prefix so built assets
    # (dist/assets/...) resolve, and unknown paths fall back to the SPA.
    location /ui/ {
        rewrite ^/ui/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    location = / {
        # Send a RELATIVE Location so the browser keeps the original host:port.
        # A plain `return 302 /ui/` is absolutized by nginx using the
        # container's listen port (80), which breaks host port mappings
        # like 8080:80.
        add_header Location /ui/ always;
        return 302;
    }

    # Gateway admin API — proxied same-origin so no CORS is needed.
    # The nginx entrypoint substitutes ${GATEWAY_URL} from the environment.
    location ~ ^/(clients|carriers|numbers|stats)(/|$) {
        proxy_pass ${GATEWAY_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
