version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: gomsggw-db
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: always
    networks:
      - gomsggw-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  gomsggw:
    image: gomsggw:latest
    container_name: gomsggw
    env_file:
      - .env
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - gomsggw-network
    ports:
      - "80:3000" # Web API
      - "2775:2775" # SMPP
      - "2566:2566" # MM4
    environment:
      - SERVER_ID=gomsggw1
      - POSTGRES_HOST=postgres

  admin-ui:
    build:
      context: ./admin-ui
    container_name: gomsggw-admin-ui
    restart: always
    depends_on:
      - gomsggw
    networks:
      - gomsggw-network
    ports:
      - "8080:80" # Admin control panel → http://<host>:8080/ui/
    environment:
      # In-stack: nginx inside this container proxies the admin API to the gateway
      - GATEWAY_URL=http://gomsggw:3000

networks:
  gomsggw-network:
    # Explicit name so admin-ui/docker-compose.yml (standalone mode) can
    # attach to the same network externally.
    name: gomsggw-network
    driver: bridge

volumes:
  postgres_data:
