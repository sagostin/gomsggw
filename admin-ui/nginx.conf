server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA lives under /ui (matches /ui, /ui/, /ui/anything) — rewrite strips
    # the prefix so built assets (dist/assets/...) resolve, and unknown
    # paths fall back to the SPA for history routing.
    location /ui {
        rewrite ^/ui/?(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # Root serves the SPA directly. No 302 redirect on purpose:
    #  - `return 302 /ui/` gets absolutized by nginx with the container's
    #    listen port (80), breaking host port mappings like 8080:80
    #  - add_header Location + bare return 302 duplicates the Location
    #    header via error-page processing (ERR_RESPONSE_HEADERS_MULTIPLE_LOCATION)
    # The SPA's router redirects "/" → "/ui/" client-side after load.
    location = / {
        try_files /index.html =404;
    }

    # Gateway admin API — proxied same-origin so no CORS is needed.
    # The nginx entrypoint substitutes ${GATEWAY_URL} from the environment.
    location ~ ^/(clients|carriers|numbers|stats)(/|$) {
        proxy_pass ${GATEWAY_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }
}
